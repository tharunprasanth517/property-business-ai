{% extends "base.html" %}

{% block title %}Adjust Stock — {{ product.name }}{% endblock %}

{% block content %}
<div class="card dashboard-card" style="max-width:640px; width:100%;">
    <h1>Adjust Stock</h1>
    <p class="meta">{{ product.name }} &middot; Current stock: {{ stock.quantity }} {{ product.unit_of_measure }}</p>

    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <label for="transaction_type">Movement type</label>
            <select name="transaction_type" id="transaction_type">
                <option value="PURCHASE">Purchase</option>
                <option value="SALE">Sale</option>
                <option value="RETURN_IN">Return In</option>
                <option value="RETURN_OUT">Return Out</option>
                <option value="DAMAGE">Damage</option>
                <option value="ADJUSTMENT">Adjustment</option>
            </select>
        </div>

        <div class="form-group">
            <label for="quantity_change">Quantity change</label>
            <input type="number" name="quantity_change" id="quantity_change" value="0" step="1" required>
        </div>

        <div class="form-group">
            <label for="notes">Notes</label>
            <textarea name="notes" id="notes" rows="3"></textarea>
        </div>

        <button type="submit" class="btn btn-primary">Save</button>
    </form>
</div>
{% endblock %}
