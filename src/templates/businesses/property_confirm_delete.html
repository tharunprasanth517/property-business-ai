{% extends "base.html" %}

{% block title %}Delete Property — Property Business AI{% endblock %}

{% block content %}
<div class="card" style="max-width:540px; width:100%;">
    <h1>Delete Property</h1>
    <p>Are you sure you want to delete <strong>{{ property.name }}</strong>?</p>

    <form method="post">
        {% csrf_token %}
        <div style="margin-top:1.25rem; display:flex; gap:0.75rem; flex-wrap:wrap;">
            <button type="submit" class="btn btn-danger">Delete</button>
            <a href="{% url 'businesses:property_detail' property.id %}" class="btn" style="background:#f3f4f6; color:#111827;">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
